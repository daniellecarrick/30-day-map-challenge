<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Cuisine Capitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<!-- build.py inlines these three so out/nyc_cuisine_capitals.html is a single file -->
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  .page { max-width: 1280px; }
  .main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px;
          grid-template-rows: auto minmax(0, 1fr); gap: 0 28px; }
  .main > .map-wrap { grid-column: 1; grid-row: 1 / 3; }
  .main > .picker { grid-column: 2; grid-row: 1; padding-top: 4px; }
  .main > .side { grid-column: 2; grid-row: 2; }
  .land { fill: var(--ctl); }
  .hexes path { stroke: none; }
  .boro { fill: none; stroke: var(--ink); stroke-width: 0.6; vector-effect: non-scaling-stroke; pointer-events: none; }
  .dots { fill: none; stroke: var(--ink); stroke-opacity: .35; stroke-linecap: round; pointer-events: none; }
  .mark { fill: none; stroke: var(--ink); stroke-width: 1.8; vector-effect: non-scaling-stroke; pointer-events: none; }
  .mark.also { stroke-width: 1; }
  .hover { fill: none; stroke: var(--ink); stroke-width: 2.4; vector-effect: non-scaling-stroke; pointer-events: none; }
  .hover-dot { fill: var(--ink); stroke: var(--bg); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }

  /* side panel: picker + numbers + context for the chosen cuisine */
  .side { overflow-y: auto; padding: 0 2px 8px; align-self: start; max-height: 100%; }
  .pick-label { display: block; color: var(--muted); margin-bottom: 4px; }
  .side h2 { font-family: var(--font-head); font-size: 24px; line-height: 1.2; margin: 16px 0 2px; }
  .side .big { color: var(--muted); margin: 0 0 14px; }
  .side .big b { color: var(--ink); }
  .side h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 14px 0 4px; }
  .place { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none;
           border: 0; border-left: 3px solid transparent; padding: 3px 0 3px 8px; margin-left: -11px; cursor: default; }
  .place:hover, .place:focus-visible { border-left-color: var(--ink); outline: none; }
  .place .name { font-weight: 600; }
  .place .m { color: var(--muted); }
  .meter { position: relative; height: 8px; border-radius: 4px; background: var(--ctl); margin: 8px 0 6px; }
  .meter span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink); }
  .side .context { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
  .dd, .dd select { width: 100%; }
  #mode { margin-bottom: 12px; }
  #mode.seg { display: flex; }
  #mode.seg button { flex: 1; }
  .hexes path { transition: opacity .15s; }
  .hexes path.dim { opacity: .12; }
  .fam { display: grid; grid-template-columns: 14px 1fr; gap: 0 10px; width: 100%; text-align: left; font: inherit;
         color: var(--ink); background: none; border: 0; padding: 6px 0; cursor: default; }
  .fam .sw { width: 14px; height: 14px; border-radius: 2px; margin-top: 3px; }
  .fam .name { font-weight: 600; }
  .fam .m { grid-column: 2; color: var(--muted); }
  .fam:hover .name, .fam:focus-visible .name { text-decoration: underline; }
  .fam:focus-visible { outline: none; }

  @media (max-width: 860px) {
    .page { height: auto; }
    .main { display: flex; flex-direction: column; }
    .picker { order: -1; margin-bottom: 8px; }
    .side { max-height: none; overflow: visible; margin-top: 8px; }
    .map-wrap { flex: none; }
    .map-wrap > svg { height: auto; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="main">
    <div class="map-wrap" id="map"></div>
    <div class="picker">
      <div id="mode" aria-label="Map view"></div>
      <div id="pick-wrap">
        <label class="pick-label" for="pick-select">Cuisine</label>
        <div id="pick"></div>
      </div>
    </div>
    <aside class="side" aria-live="polite">
     <div id="side-top">
      <h2>The standout cuisine</h2>
      <p class="big" id="t-big"></p>
      <div id="t-fams"></div>
      <p class="context" id="t-note"></p>
     </div>
     <div id="side-one">
      <h2 id="c-name"></h2>
      <p class="big" id="c-big"></p>
      <h3>Most concentrated</h3>
      <div id="c-peak"></div>
      <div id="c-famous-wrap"><h3>The namesake neighborhood</h3><div id="c-famous"></div></div>
      <div id="c-also-wrap"><h3>Also strong</h3><div id="c-also"></div></div>
      <h3>How clustered</h3>
      <div class="meter"><span id="c-meter"></span></div>
      <div id="c-cluster"></div>
      <p class="context" id="c-context"></p>
     </div>
    </aside>
  </div>
  <footer><span id="how"></span> Data: <a id="src">NYC DOHMH Restaurant Inspection Results</a> (Nov 2026) · #30DayMapChallenge <span id="day"></span></footer>
</div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="../../shared/components.js"></script>
<script>
const D = window.DATA;
const W = 640, H = 640;
const proj = d3.geoIdentity().reflectY(true).fitExtent([[6, 6], [W - 6, H - 6]], D.boroughs);
const path = d3.geoPath(proj);
const tip = MapKit.tooltip();
const fmt = d3.format(","), pct = v => `${Math.round(100 * v)}%`, x1 = v => `${v.toFixed(1)}×`;

const F = D.flavor;
const LEDE = {
  one: `For every spot in the city: how much more common a cuisine is among the restaurants within ${D.r} m than in NYC overall.`,
  top: `Every spot in the city, colored by the cuisine that is most over-represented among the restaurants within ${D.r} m.`,
};
d3.select("#day").text(D.day);
d3.select("#src").attr("href", D.source_url);
d3.select("#how").text(`${fmt(D.n_rest)} restaurants inspected since ${D.since}, by the cuisine they registered; every cuisine with ${D.min_cuisine}+ restaurants. ` +
  `${D.hex} m hexes, each scored on the restaurants within ${D.r} m of its center; uncolored where a cuisine is under ${D.labels[0]} the city share or there are fewer than ${D.min_n} restaurants.`);

// hex geometry in screen units (pointy-top, same as build.py)
const N = D.hx.length;
const cx = new Float32Array(N), cy = new Float32Array(N);
for (let i = 0; i < N; i++) { const [x, y] = proj([D.hx[i], D.hy[i]]); cx[i] = x; cy[i] = y; }
const sPx = (D.hex / Math.sqrt(3)) * Math.abs(proj([1, 0])[0] - proj([0, 0])[0]);
const corners = d3.range(6).map(k => { const a = Math.PI / 180 * (30 + 60 * k); return [sPx * Math.cos(a), -sPx * Math.sin(a)]; });
const hexD = i => "M" + corners.map(([dx, dy]) => `${(cx[i] + dx).toFixed(1)},${(cy[i] + dy).toFixed(1)}`).join("L") + "Z";
const place = i => D.places[D.hplace[i]];

const svg = d3.select("#map").append("svg").attr("viewBox", `0 0 ${W} ${H}`)
  .attr("preserveAspectRatio", "xMidYMid meet").attr("role", "img").attr("aria-label", D.title);
svg.append("defs").append("clipPath").attr("id", "landclip")
  .selectAll("path").data(D.boroughs.features).join("path").attr("d", path);
const g = svg.append("g");
g.append("g").selectAll("path").data(D.boroughs.features).join("path").attr("class", "land").attr("d", path);
const gHex = g.append("g").attr("class", "hexes").attr("clip-path", "url(#landclip)");
g.append("g").selectAll("path").data(D.boroughs.features).join("path").attr("class", "boro").attr("d", path);
const dotPath = g.append("path").attr("class", "dots");
const gMark = g.append("g"), hoverHex = g.append("path").attr("class", "hover"), hoverDot = g.append("circle").attr("class", "hover-dot");

const colorOf = (lq, n) => {
  if (n < D.min_n) return null;
  let b = -1;
  for (let j = 0; j < D.bins.length; j++) if (lq >= D.bins[j]) b = j;
  return b < 0 ? null : D.ramp[b];
};

let cur = null, kFull = null, dots = [], delaunay = null, k = 1, transform = d3.zoomIdentity;
const hexDelaunay = d3.Delaunay.from(d3.range(N), i => cx[i], i => cy[i]);
const share = i => kFull[i] / D.hn[i];

// a row in the side panel naming one spot; hovering or focusing it outlines that hex on the map
function placeRow(sel, i, name, extra) {
  sel.append("button").attr("type", "button").attr("class", "place")
    .html(`<span class="name">${name}</span>: ${pct(share(i))}${extra ? ` <span class="m">${extra}</span>` : ""}`)
    .on("mouseenter focus", () => hoverHex.attr("d", hexD(i)))
    .on("mouseleave blur", () => hoverHex.attr("d", null));
}

let mode = "one", lastKey = "Chinese";
function render(key) {
  lastKey = key;
  if (mode !== "one") return;
  cur = D.cuisines.find(c => c.key === key);
  kFull = new Uint16Array(N);
  cur.ki.forEach((i, j) => { kFull[i] = cur.kv[j]; });

  const byColor = new Map();
  for (let i = 0; i < N; i++) {
    const n = D.hn[i], c = colorOf(n ? kFull[i] / n / cur.city : 0, n);
    if (c) byColor.set(c, (byColor.get(c) || "") + hexD(i));
  }
  gHex.selectAll("path").data([...byColor], d => d[0]).join("path").attr("class", null).attr("fill", d => d[0]).attr("d", d => d[1]);

  dots = [];
  for (let j = 0; j < cur.pts.length; j += 2) {
    const [x, y] = proj([cur.pts[j], cur.pts[j + 1]]);
    dots.push({ x, y, name: cur.names[j / 2] });
  }
  delaunay = d3.Delaunay.from(dots, d => d.x, d => d.y);
  dotPath.attr("d", dots.map(d => `M${d.x.toFixed(1)},${d.y.toFixed(1)}h0`).join(""));

  const marks = [{ i: cur.peak, c: "mark" }, ...cur.also.map(i => ({ i, c: "mark also" }))];
  if (cur.famous_i != null) marks.push({ i: cur.famous_i, c: "mark" });
  gMark.selectAll("path").data(marks).join("path").attr("class", d => d.c).attr("d", d => hexD(d.i));

  // side panel
  const p = cur.peak;
  d3.select("#c-name").text(cur.label);
  d3.select("#c-big").html(`<b>${(100 * cur.city).toFixed(1)}%</b> of NYC restaurants (${fmt(cur.count)})`);
  d3.select("#c-peak").html("").call(s => placeRow(s, p, place(p), `of ${D.hn[p]} nearby restaurants, ${x1(share(p) / cur.city)} the city share`));
  d3.select("#c-famous-wrap").style("display", cur.famous ? null : "none");
  if (cur.famous) {
    const f = cur.famous_i;
    d3.select("#c-famous").html("").call(s => placeRow(s, f, cur.famous, `of ${D.hn[f]}, ${x1(share(f) / cur.city)}`));
  }
  d3.select("#c-also-wrap").style("display", cur.also.length ? null : "none");
  d3.select("#c-also").html("").call(s => cur.also.forEach(i => placeRow(s, i, place(i))));
  d3.select("#c-meter").style("width", pct(cur.clustered));
  d3.select("#c-cluster").html(`<b>${pct(cur.clustered)}</b> of these restaurants are surrounded by others like them: ` +
    `among the other restaurants within ${D.r} m, this cuisine is ${D.cluster_x}× its city share or more.`);
  d3.select("#c-context").text(cur.context);
  restyle();
  hideHover();
}

// "Top cuisine" view: each hex in its standout cuisine's family color
const famOf = new Map(F.families.flatMap((f, fi) => f.members.map(([label]) => [label, fi])));
function renderTop() {
  cur = null; kFull = null; dots = []; delaunay = null;
  const byFam = F.families.map(() => "");
  for (let i = 0; i < N; i++) {
    const w = F.win[i];
    if (w >= 0) byFam[famOf.get(D.cuisines[w].label)] += hexD(i);
  }
  gHex.selectAll("path").data(byFam.map((d, fi) => [fi, d]), d => "f" + d[0]).join("path")
    .attr("class", null).attr("fill", d => `var(--cat-${d[0] + 1})`).attr("d", d => d[1]);
  dotPath.attr("d", null);
  gMark.selectAll("path").data(F.families.filter(f => f.peak != null).map(f => ({ i: f.peak, c: "mark" })))
    .join("path").attr("class", d => d.c).attr("d", d => hexD(d.i));

  const [top, next] = F.families.flatMap(f => f.members).sort((a, b) => b[1] - a[1]);
  d3.select("#t-big").html(`Of ${fmt(F.spots)} spots where one cuisine stands out, <b>${top[0]}</b> leads in ${fmt(top[1])}, ` +
    `more than any other (${next[0]} is next, ${fmt(next[1])}). Colors group the ${D.cuisines.length} cuisines into families.`);
  const rows = d3.select("#t-fams").html("").selectAll("button").data(F.families).join("button")
    .attr("type", "button").attr("class", "fam")
    .on("mouseenter focus", (_, f) => gHex.selectAll("path").classed("dim", d => d[0] !== F.families.indexOf(f)))
    .on("mouseleave blur", () => gHex.selectAll("path").classed("dim", false));
  rows.append("span").attr("class", "sw").style("background", (_, fi) => `var(--cat-${fi + 1})`);
  rows.append("span").html(f => `<span class="name">${f.name}</span> · ${fmt(f.count)} spots`);
  rows.append("span").attr("class", "m").text(f => f.members.slice(0, 4).map(([c, n]) => `${c} ${n}`).join(", ") +
    (f.members.length > 4 ? `, +${f.members.length - 4} more` : ""));
  d3.select("#t-note").text(`A cuisine needs at least ${F.min_k} restaurants within ${D.r} m and ${D.labels[0]} its city share to stand out. ` +
    `Hover a family to see only its spots; pick "One cuisine" for the details of any of them.`);
  hideHover();
}

function setMode(m) {
  mode = m;
  d3.select("#title").text(m === "top" ? F.title : D.title);
  d3.select("#lede").text(LEDE[m]);
  d3.select("#pick-wrap").style("display", m === "one" ? null : "none");
  d3.select("#side-one").style("display", m === "one" ? null : "none");
  d3.select("#side-top").style("display", m === "top" ? null : "none");
  legendOne.style("display", m === "one" ? null : "none");
  legendTop.style("display", m === "top" ? null : "none");
  if (m === "top") renderTop(); else render(lastKey);
}

function restyle() { dotPath.attr("stroke-width", 1.8 / Math.sqrt(k)); hoverDot.attr("r", 3 / Math.sqrt(k)); }

function hexHtml(i) {
  const n = D.hn[i];
  const head = `<b>${place(i)}</b>`;
  if (n < D.min_n) return `${head}<span class="m">Only ${n} restaurant${n === 1 ? "" : "s"} within ${D.r} m: too few to say.</span>`;
  if (mode === "top") {
    const w = F.win[i];
    if (w < 0) return `${head}<span class="m">No cuisine stands out among the ${n} restaurants within ${D.r} m.</span>`;
    const c = D.cuisines[w], fam = F.families[famOf.get(c.label)].name;
    const kk = c.kv[c.ki.indexOf(i)];
    return `${head}Standout: ${c.label}<br><span class="m">${pct(kk / n)} of the ${n} restaurants within ${D.r} m, ` +
      `${x1(F.best[i])} the city share · ${fam}</span>`;
  }
  const c = kFull[i];
  const s = c / n;
  return `${head}${cur.label}: ${pct(s)} of the ${n} restaurants within ${D.r} m` +
    `<br><span class="m">${x1(s / cur.city)} the city share (${(100 * cur.city).toFixed(1)}%)</span>`;
}
function hideHover() { tip.hide(); hoverHex.attr("d", null); hoverDot.attr("display", "none"); }

// one hover for everything: the nearest restaurant dot within 10px wins, else the hex under the pointer
svg.on("pointermove", ev => {
  if (mode === "one" && !cur) return;
  const [mx, my] = transform.invert(d3.pointer(ev, svg.node()));
  const vb = svg.node().viewBox.baseVal, r = svg.node().getBoundingClientRect();
  const pxPerUnit = Math.min(r.width / vb.width, r.height / vb.height) * transform.k;
  const hi = hexDelaunay.find(mx, my);
  if (Math.hypot(cx[hi] - mx, cy[hi] - my) > sPx * 1.05) { hideHover(); return; }
  const di = dots.length ? delaunay.find(mx, my) : -1;
  if (di >= 0 && Math.hypot(dots[di].x - mx, dots[di].y - my) * pxPerUnit <= 10) {
    const d = dots[di];
    hoverDot.attr("display", null).attr("cx", d.x).attr("cy", d.y);
    hoverHex.attr("d", null);
    tip.show(ev, `<b>${d.name}</b><span class="m">${cur.label} · ${place(hexDelaunay.find(d.x, d.y))}</span>`);
    return;
  }
  hoverDot.attr("display", "none");
  hoverHex.attr("d", hexD(hi));
  tip.show(ev, hexHtml(hi));
}).on("pointerleave", hideHover);

const zoom = d3.zoom().scaleExtent([1, 16]).translateExtent([[0, 0], [W, H]])
  .on("zoom", ev => { transform = ev.transform; k = ev.transform.k; g.attr("transform", ev.transform); restyle(); hideHover(); });
svg.call(zoom).on("dblclick.zoom", null);

// legend in the empty top-left (New Jersey)
const swatch = c => s => s.append("rect").attr("x", -7).attr("y", -7).attr("width", 14).attr("height", 14).attr("rx", 2).attr("fill", c);
const legendOne = MapKit.legend(svg, {
  x: 8, y: 8, width: 200,
  title: "Times the city share",
  keys: [
    ...D.ramp.map((c, j) => ({ label: j < D.labels.length - 1 ? `${D.labels[j]}–${D.labels[j + 1]}` : `${D.labels[j]} or more`, draw: swatch(c) })),
    { label: "One restaurant", draw: s => s.append("circle").attr("r", 1.6).attr("fill", "var(--ink)").attr("opacity", .6) },
    { label: "Spots named in the panel", draw: s => s.append("path").attr("d", "M0,-6L5.2,-3L5.2,3L0,6L-5.2,3L-5.2,-3Z").attr("class", "mark") },
  ],
});

const legendTop = MapKit.legend(svg, {
  x: 8, y: 8, width: 230,
  title: "Standout cuisine",
  keys: [
    ...F.families.map((f, fi) => ({ label: f.name, draw: swatch(`var(--cat-${fi + 1})`) })),
    { label: "Strongest spot of a family", draw: s => s.append("path").attr("d", "M0,-6L5.2,-3L5.2,3L0,6L-5.2,3L-5.2,-3Z").attr("class", "mark") },
  ],
});

MapKit.dropdown("#pick", D.cuisines.map(c => ({ value: c.key, label: c.label, group: c.group })), render, "Chinese", "Cuisine");
d3.select("#pick select").attr("id", "pick-select");
MapKit.segmented("#mode", [{ value: "one", label: "One cuisine" }, { value: "top", label: "Top cuisine" }], setMode, "one");
</script>
</body>
</html>
