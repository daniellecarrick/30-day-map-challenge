name = "day10-claude-geo-guess"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Pages allowed to call this API (comma-separated, no trailing slash). Add http://localhost:8000 for local testing.
ALLOWED_ORIGINS = "https://daniellecarrick.github.io"
MODEL = "claude-haiku-5-5"
HOURLY_LIMIT = "8"     # guesses per visitor per hour
DAILY_LIMIT = "300"    # guesses for everyone per day (a hard ceiling on cost)

[[d1_databases]]
binding = "DB"
database_name = "day10-guesses"
database_id = "6d2707ca-1f17-4700-992f-125fe0cd32b8"
