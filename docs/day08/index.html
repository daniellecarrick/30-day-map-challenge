<!-- build.py inlines these three so out/utopias.html is a single file -->
<style>
/* Shared web theme for the #30DayMapChallenge series.
   Values mirror shared/tokens.json; change both together.
   Minimum text size on every page is 14px (legends, tooltips, controls); the footer credit line is 11px.
   Pages load Bitter (headlines) + Raleway (body) from Google Fonts (tokens.json font.web_css). */

:root {
  --bg: #ffffff; --ink: #2b2b28; --muted: #6b6b66; --edge: #ffffff; --closed: #8a8a86;
  --ctl: #f0efec; --ctl-on: #ffffff; --accent: #3987e5;
  --font: "Raleway", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  /* NYC subway trunk colors (tokens.json scales.subway) */
  --sub-123: #ee352e; --sub-456: #00933c; --sub-7: #b933ad; --sub-ACE: #0039a6; --sub-BDFM: #ff6319;
  --sub-G: #6cbe45; --sub-JZ: #996633; --sub-L: #a7a9ac; --sub-NQRW: #fccc0a; --sub-S: #808183; --sub-SIR: #1d5da8;
  --font-head: "Bitter", Georgia, "Times New Roman", serif;
  /* categorical (tokens.json scales.categorical_light / _dark): assign in this order, never cycle */
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #6250d6; --cat-8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b19; --ink: #ecebe6; --muted: #a3a29c; --edge: #1b1b19; --closed: #8f8e88;
    --ctl: #2c2c29; --ctl-on: #45453f;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b19; --ink: #ecebe6; --muted: #a3a29c; --edge: #1b1b19; --closed: #8f8e88;
  --ctl: #2c2c29; --ctl-on: #45453f;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
}

/* Aged-paper palette (tokens.json vintage). Use with <html data-palette="vintage" data-theme="light">. */
:root[data-palette="vintage"] {
  --bg: #f4ecd9; --ink: #3a2c1e; --muted: #6b5a45; --edge: #f4ecd9; --closed: #8f8674;
  --ctl: #e8dcc2; --ctl-on: #fbf6ea; --accent: #1c5a94; --land: #faf5e8; --water: #7f9aa3;
  --era-1: #8c2f22; --era-2: #d9695c; --era-3: #dfb02f; --era-4: #6f9a5e; --era-5: #74b4d4; --era-6: #1c5a94;
}

/* Aged-paper palette (tokens.json vintage). Use with <html data-palette="vintage" data-theme="light">. */
:root[data-palette="vintage"] {
  --bg: #f4ecd9; --ink: #3a2c1e; --muted: #6b5a45; --edge: #f4ecd9; --closed: #8f8674;
  --ctl: #e8dcc2; --ctl-on: #fbf6ea; --accent: #1c5a94; --land: #faf5e8; --water: #7f9aa3;
  --era-1: #8c2f22; --era-2: #d9695c; --era-3: #dfb02f; --era-4: #6f9a5e; --era-5: #74b4d4; --era-6: #1c5a94;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
       font-variant-numeric: lining-nums; }

/* ---- page layout: header / map that fills the rest of the viewport / footer ---- */
.page { height: 100dvh; display: flex; flex-direction: column;
        max-width: 1100px; margin: 0 auto; padding: 16px 16px 10px; }
.page > header { flex: none; text-align: center; }
.page h1 { font-size: clamp(22px, 2.8vw, 28px); line-height: 1.2; margin: 0 0 6px; font-weight: 700;
            font-family: var(--font-head); text-wrap: balance; }
.lede { color: var(--muted); margin: 0 auto 10px; max-width: 640px; text-wrap: balance; }
.map-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
.map-wrap > svg { width: 100%; height: 100%; display: block; }
.page > footer { flex: none; text-align: center; color: var(--muted); font-size: 11px;
                 margin-top: 6px; text-wrap: balance; }
.page > footer a { color: inherit; }
/* "← All maps" link added by publish.py: pinned top-left on wide screens, above the title on phones */
.home-link { position: fixed; top: 10px; left: 12px; z-index: 20; font: 600 14px/1 var(--font);
             color: var(--muted); text-decoration: none; padding: 6px 8px; border-radius: 6px; background: var(--bg); }
.home-link:hover { color: var(--ink); }
@media (max-width: 900px) {
  .home-link { position: static; display: inline-block; margin: 8px 0 0 8px; }
}
/* phones: let the page scroll and the map take its natural height */
@media (max-width: 640px), (max-height: 520px) {
  .page { height: auto; }
  .map-wrap > svg { height: auto; }
}

/* ---- controls ---- */
.controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 8px 14px; margin-bottom: 4px; }
.seg { display: inline-flex; background: var(--ctl); border-radius: 8px; padding: 3px; }
.seg button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0;
              padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ctl-on); color: var(--ink); font-weight: 600;
                                   box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stat { color: var(--muted); font-size: 14px; }
/* dropdown (MapKit.dropdown): same surface as the segmented toggle, chevron drawn in CSS */
.dd { position: relative; display: inline-block; }
.dd select { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--ctl);
             border: 0; border-radius: 8px; padding: 8px 34px 8px 12px; cursor: pointer;
             appearance: none; -webkit-appearance: none; max-width: 100%; }
.dd select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dd::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; margin-top: -6px;
             border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
/* play / pause button for animated maps: same surface as the toggle; put an icon <svg> before the label */
.play { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--ctl);
        border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; display: inline-flex; gap: 8px;
        align-items: center; }
.play:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.play svg { fill: currentColor; }
/* the current value of an animated control (a clock, a date), in the headline face */
.readout { font: 700 20px/1 var(--font-head); }

/* ---- map marks ---- */
.cell { stroke: var(--edge); stroke-width: 0.5; }
.cell:hover { stroke: var(--ink); stroke-width: 1.5; }
.boundary { fill: none; stroke: var(--ink); stroke-width: 0.5; pointer-events: none; }
.pt { fill: var(--ink); pointer-events: none; }
.closed { fill: var(--closed); stroke: var(--bg); stroke-width: 1; }

/* ---- in-map legend (HTML overlay placed over the map by MapKit.legend, so text stays 14px) ---- */
.legend { position: absolute; z-index: 2; font-size: 14px; line-height: 1.3; color: var(--ink); pointer-events: none; }
.legend .lg-title { font-weight: 600; }
.legend .lg-bar { height: 12px; border-radius: 2px; margin-top: 6px; }
.legend .lg-ticks { position: relative; height: 22px; }
.legend .lg-ticks span { position: absolute; top: 0; padding-top: 5px; white-space: nowrap; }
.legend .lg-ticks span::before { content: ""; position: absolute; top: 0; left: 0; width: 1px; height: 4px; background: var(--muted); }
.legend .lg-ticks span.mid { transform: translateX(-50%); }
.legend .lg-ticks span.mid::before { left: 50%; }
.legend .lg-ticks span.end { transform: translateX(-100%); }
.legend .lg-ticks span.end::before { left: auto; right: 0; }
.legend .lg-key { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
.legend .lg-key svg { flex: none; overflow: visible; }
.legend .lg-muted { color: var(--muted); }
/* phones: the legend sits under the map instead of on it */
@media (max-width: 640px) { .legend { position: static; margin-top: 8px; } }

/* ---- tooltip ---- */
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--bg); color: var(--ink);
       border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); border-radius: 6px;
       padding: 8px 10px; font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.12);
       max-width: 260px; opacity: 0; transition: opacity .1s; }
.tip b { display: block; margin-bottom: 2px; }
.tip .m { color: var(--muted); }
</style>
<style>
  .land { fill: var(--ctl); stroke: var(--bg); stroke-width: .8; }
  .dot { fill-opacity: .82; stroke: var(--bg); stroke-width: .7; }
  .dot.on { stroke: var(--ink); stroke-width: 1.6; fill-opacity: 1; }
  .dot.religious, .bar.religious { fill: var(--cat-1); stroke-color: var(--cat-1); }
  .dot.secular, .bar.secular { fill: var(--cat-2); }
  .dot.unknown { fill: var(--closed); fill-opacity: 1; }
  .size-ring { fill: none; stroke: var(--muted); }
  .view { position: absolute; inset: 0; }
  .view[hidden] { display: none; }
  #timeline > svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .bar { stroke: none; }
  .bar.religious { fill: var(--cat-1); }
  .bar.secular { fill: var(--cat-2); }
  .bar.unknown { fill: var(--closed); }
  .row.on .bar { fill: var(--ink); }
  .arrow.religious { fill: var(--cat-1); } .arrow.secular { fill: var(--cat-2); }
  .row.on .arrow { fill: var(--ink); }
  .axis text { fill: var(--muted); font: 14px var(--font); }
  .axis line { stroke: color-mix(in srgb, var(--ink) 12%, transparent); }
  .axis .now line { stroke: var(--muted); stroke-dasharray: 2 3; }
  .hit { fill: transparent; }
  .tip { max-width: 320px; }
  .tip .note { margin-top: 6px; padding-top: 6px; line-height: 1.35;
               border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
  .tl-legend { position: absolute; left: 8px; bottom: 34px; pointer-events: none; }
  /* phones: both views take their natural height and the page scrolls */
  @media (max-width: 640px), (max-height: 520px) {
    .map-wrap { min-height: 0; }
    .view { position: static; }
    #timeline { height: 900px; position: relative; }
    .tl-legend { position: static; margin-top: 8px; }
  }
</style>

d":1880,"active":false,"years":32,"notes":"A religious Utopian socialist community. Oneida Community practices included Bible communism, Complex Marriage, Free love, Stirpiculture, Male Continence, Mutual Criticism and Ascending Fellowship. Other Noyesian communities were founded in Wallingford, Connecticut; Newark, New Jersey; Putney and Cambridge, Vermont.","x":1639713,"y":2406070},{"name":"Modern Times","basis":"secular","movement":"Individualist anarchist","place":"Brentwood, New York","start":1851,"end":1864,"active":false,"years":13,"notes":"Founded upon individual sovereignty, equitable commerce and mutualism.","x":1886474,"y":2201118},{"name":"Aurora Colony","basis":"religious","movement":"Christian (Keil)","place":"Oregon","start":1853,"end":1883,"active":false,"years":30,"notes":"Christian utopian community","x":-2072121,"y":2765260},{"name":"Raritan Bay Union","basis":"secular","movement":"Fourierist","place":"Perth Amboy, NJ","start":1853,"end":1860,"active":false,"years":7,"notes":"A Fourierist community.","x":1808568,"y":2152068},{"name":"Free Lovers at Davis House","basis":"secular","movement":"Free love / Spiritualist","place":"Berlin Heights, Erie County, Ohio","start":1854,"end":1858,"active":false,"years":4,"notes":"A community based on Free love and spiritualism.","x":1118200,"y":2114792},{"name":"Amana Colonies","basis":"religious","movement":"Inspirationist","place":"Amana (CDP), Iowa","start":1855,"end":1932,"active":false,"years":77,"notes":"The Amana villages were built one hour apart when traveling by ox cart. Each village had a church, a farm, multi-family residences, workshops and communal kitchens. Operated woolen and flour mills. Prosperous by the 1890s when it was one of the three strongest communistic societies in the U.S. Its communal aspects narrowed in 1932, but its extensive holdings of farm and woodland never divided. Gave rise to the Amana Corporation, a maker of kitchen appliances.","x":340408,"y":2096179},{"name":"La R\u00e9union","basis":"secular","movement":"Fourierist","place":"Dallas, TX","start":1855,"end":1857,"active":false,"years":2,"notes":"A Fourierist community.","x":-79820,"y":1076788},{"name":"Octagon City","basis":"secular","movement":"Vegetarian","place":"Kansas","start":1856,"end":1857,"active":false,"years":1,"notes":"Originally built as a vegetarian colony north of the present-day site of Chanute, Kansas near Vegetarian Creek, a tributary of the Neosho River","x":50351,"y":1636168},{"name":"Philadelphia Shakers","basis":"religious","movement":"Shaker","place":"Philadelphia, Pennsylvania","start":1858,"end":1910,"active":false,"years":52,"notes":"","x":1750288,"y":2074340},{"name":"Silkville","basis":"secular","movement":"Fourierist","place":"Williamsburg, KS","start":1869,"end":1892,"active":false,"years":23,"notes":"Sericulture farm in Kansas that was founded on Fourierian principles. Later shifted away from Fourierism before its collapse.","x":44162,"y":1713382},{"name":"Workingmen's Co-operative Colony","basis":"secular","movement":"Chartist","place":"Kansas","start":1869,"end":1874,"active":false,"years":5,"notes":"A community based on the political reform philosophy of Chartist James Bronterre O'Brien.","x":100230,"y":1646619},{"name":"Union Colony","basis":"secular","movement":"Temperance colony","place":"Colorado","start":1870,"end":null,"active":false,"years":null,"notes":"An agricultural temperance community bankrolled by Horace Greeley. Initiated by Nathan Meeker with an article in The New York Tribune in Nov 1869. Meeker selected 800 people from letters submitted and started the colony in May 1870. Still a thriving community but gradually moved away from the ideas of utopia and temperance.","x":-731192,"y":1967257},{"name":"Progressive Colony, near Cedar Vale","basis":"secular","movement":"Communist","place":"Kansas","start":1871,"end":1879,"active":false,"years":8,"notes":"A Russian communist colony with a mixture of atheism and liberal Christianity. Fell apart due to the domineering and sometimes cruel manner of its founder.","x":-44018,"y":1562700},{"name":"Zion Valley","basis":"religious","movement":"Bickertonite","place":"Kansas","start":1875,"end":1879,"active":false,"years":4,"notes":"Bickertonite Mormon religious colony that secularized in 1879 to become the town of St. John, Kansas.","x":-240131,"y":1666313},{"name":"Danish Socialist Colony","basis":"secular","movement":"Socialist","place":"Kansas","start":1877,"end":1877,"active":false,"years":0,"notes":"A utopian socialist community near Hays","x":-285467,"y":1766388},{"name":"Esperanza","basis":"secular","movement":"Communist","place":"Kansas","start":1877,"end":1879,"active":false,"years":2,"notes":"A utopian communist community founded by settlers from Missouri.","x":62702,"y":1614494},{"name":"Rugby","basis":"secular","movement":"Cooperative colony","place":"Tennessee","start":1880,"end":1887,"active":false,"years":7,"notes":"A community based on Christian socialism. \u201cAssociations\u201d (joint-stock corporations) operated general store and other businesses. A tomato cannery and Rugby Pottery Company operated as joint-stock enterprise but failed financially. Hughes left scene in 1887, $250,000 poorer.","x":1002335,"y":1538841},{"name":"Am Olam","basis":"secular","movement":"Jewish agrarian socialist","place":"Oregon and various locations across the US","start":1881,"end":null,"active":false,"years":null,"notes":"Jewish social movement that sought to create agricultural communities in America.","x":-2164961,"y":2566814},{"name":"Shalam Colony","basis":"religious","movement":"Faithist","place":"New Mexico","start":1884,"end":1901,"active":false,"years":17,"notes":"A community in which members would live peaceful, vegetarian lifestyles, and where orphaned urban children were to be raised.","x":-1007511,"y":1083774},{"name":"Kaweah Colony","basis":"secular","movement":"Socialist","place":"Sierra Nevada range, California","start":1886,"end":1892,"active":false,"years":6,"notes":"Inspired by the scientific socialism of Laurence Gronlund and Edward Bellamy. Livelihood based on logging of giant sequoia trees. This ended with creation of the Sequoia National Park. \"Squatter's Cabin\" is last surviving structure of the colony.","x":-2015154,"y":1735520},{"name":"Altruria","basis":"secular","movement":"Christian socialist","place":"California","start":1894,"end":1896,"active":false,"years":2,"notes":"Christian socialist colony inspired by William Dean Howells' 1884 novel A Traveler from Altruria.","x":-2279039,"y":2042305},{"name":"Fairhope Single Tax Corporation, Fairhope, AL","basis":"secular","movement":"Georgist (single tax)","place":"Alabama","start":1894,"end":null,"active":true,"years":132,"notes":"Fairhope was first settled in 1894 by Georgists. The Single tax experiment was incorporated as the Fairhope Single Tax Corporation under Alabama law in 1904. The municipality of Fairhope was incorporated in 1908.","x":777229,"y":857199},{"name":"Glennis Cooperative Industrial Colony","basis":"secular","movement":"Bellamyist","place":"near Clear Lake, Puget Sound, Washington State","start":1894,"end":1895,"active":false,"years":1,"notes":"Inspired by Bellamy's book, Looking Backward, 2000\u20131887. Established with the goal \u201cown and operate manufactories, to acquire land, to build houses for its employees; to insure the employees against want, or the fear of want; and to maintain harmonious social relationships on the basis of cooperation.\u201d started as farm, suffered agricultural problems and broke up. Part of the dissension was apparently from the persuasive anarchist teaching done by Tacoma tailor Andrew Klemencic. Glennis's founders tried again at the Home Colony, Key Peninsula.","x":-1901942,"y":3090613},{"name":"Koreshan Unity","basis":"religious","movement":"Koreshan","place":"Estero, Florida","start":1894,"end":1982,"active":false,"years":88,"notes":"Believed in Teed as a Messiah named Koresh, entered hea esteads","basis":"secular","movement":"New Deal cooperative","place":"Roosevelt, New Jersey","start":1936,"end":1939,"active":false,"years":3,"notes":"socialist Jewish farming community formed as part of F.D.R.'s New Deal. Its history is presented in a 1983 documentary Roosevelt, New Jersey: Visions of Utopia","x":1800812,"y":2116574},{"name":"Druid Heights","basis":"secular","movement":"Bohemian","place":"California","start":1954,"end":1987,"active":false,"years":33,"notes":"Bohemian and artistic community. A meeting place used by three U.S. countercultural movements\u2014the Beat Generation of the 1950s, the hippie movement of the 1960s, and the women's movement of the 1970s.","x":-2284085,"y":1971739},{"name":"Kerista Commune","basis":"religious","movement":"Kerista","place":"New York (\"Old Tribe\"); San Francisco (\"New Tribe\")","start":1956,"end":1991,"active":false,"years":35,"notes":"Polyamorous new religious movement with communal ownership and a polyfidelitous nightly sleeping schedule.","x":-2277890,"y":1956066},{"name":"Padanaram Settlement","basis":"religious","movement":"Christian","place":"Indiana","start":1966,"end":2001,"active":false,"years":35,"notes":"Christian fundamentalist commune in rural Indiana","x":791287,"y":1780737},{"name":"Twin Oaks","basis":"secular","movement":"Egalitarian commune","place":"Virginia","start":1967,"end":null,"active":true,"years":59,"notes":"Originally a behaviourist utopian society based on the novel Walden Two; eventually becoming an egalitarian commune.","x":1558456,"y":1803363},{"name":"The Farm","basis":"religious","movement":"Spiritual (Gaskin)","place":"Lewis County, Tennessee","start":1971,"end":null,"active":true,"years":55,"notes":"Buddhist-inspired Hippie vegetarian community. De-collectivized in 1983.","x":778654,"y":1416586},{"name":"East Wind Community","basis":"secular","movement":"Egalitarian commune","place":"Ozark County, Missouri","start":1973,"end":null,"active":true,"years":53,"notes":"A secular and democratic community in which members hold all communities assets in common.","x":327344,"y":1507360},{"name":"Uranian Phalanstery and the associated First New York Gnostic Lyceum Temple","basis":"secular","movement":"Artists' collective","place":"Lower East Side of Manhattan, New York","start":1974,"end":null,"active":true,"years":52,"notes":"follows the \"Practice of the Eightfold Way on the Path\" and exercise \"Creativity in Practice of the Path\". Fourierist.","x":1827960,"y":2179756},{"name":"Acorn Community Farm","basis":"secular","movement":"Egalitarian commune","place":"Virginia","start":1993,"end":null,"active":true,"years":33,"notes":"egalitarian commune; branched off of Twin Oaks.","x":1564496,"y":1802458}],"sources":[["utopian","https://en.wikipedia.org/wiki/List_of_American_utopian_communities"],["Owenite","https://en.wikipedia.org/wiki/List_of_Owenite_communities_in_the_United_States"],["Fourierist","https://en.wikipedia.org/wiki/List_of_Fourierist_Associations_in_the_United_States"],["Shaker","https://en.wikipedia.org/wiki/Shaker_communities"]],"census":"https://www.census.gov/geographies/mapping-files/time-series/geo/carto-boundary-file.html","method":"Lifespan runs from the founding year to the year the community stopped as a communal experiment; ones still running are counted to 2026. Medians leave out 10 with unknown dates (grey)"};</script>

<script>
/* Shared web components for the #30DayMapChallenge series. Needs d3 v7 loaded first.
   window.MapKit = { tooltip, segmented, dropdown, legend, nearestHover } */
(function () {
  /** Tooltip: const tip = MapKit.tooltip(); tip.show(event, html); tip.hide(); */
  function tooltip() {
    const el = d3.select("body").append("div").attr("class", "tip");
    return {
      show(ev, html) {
        el.html(html).style("opacity", 1);
        const h = el.node().offsetHeight, below = ev.clientY + 14 + h <= innerHeight;  // flip above the pointer near the bottom
        const w = el.node().offsetWidth;   // keep the whole tip on screen, however wide a page lets it get
        el.style("left", Math.max(4, Math.min(ev.clientX + 14, innerWidth - w - 8)) + "px")
          .style("top", (below ? ev.clientY + 14 : Math.max(4, ev.clientY - 14 - h)) + "px");
      },
      hide() { el.style("opacity", 0); },
    };
  }

  /** Segmented toggle.
   *  MapKit.segmented("#toggle", [{value: "all", label: "All"}, ...], value => render(value), "all") */
  function segmented(target, options, onChange, initial) {
    const root = d3.select(target).attr("class", "seg").attr("role", "group");
    const btns = root.selectAll("button").data(options).join("button")
      .attr("type", "button").text(d => d.label)
      .on("click", (_, d) => select(d.value));
    function select(v) {
      btns.attr("aria-pressed", d => d.value === v);
      onChange(v);
    }
    select(initial ?? options[0].value);
    return { select };
  }

  /** Dropdown, for when there are too many views for a segmented toggle (more than ~6).
   *  MapKit.dropdown("#pick", [{value, label, group?}, ...], value => render(value), initial, "Cuisine")
   *  Options with a `group` are put under <optgroup> headings in first-seen order. Returns { select }. */
  function dropdown(target, options, onChange, initial, ariaLabel) {
    const root = d3.select(target).attr("class", "dd");
    const sel = root.append("select").attr("aria-label", ariaLabel ?? null);
    const groups = d3.groups(options, d => d.group ?? "");
    for (const [name, opts] of groups) {
      const parent = name ? sel.append("optgroup").attr("label", name) : sel;
      parent.selectAll("option.o").data(opts).join("option").attr("class", "o")
        .attr("value", d => d.value).text(d => d.label);
    }
    sel.on("change", () => onChange(sel.property("value")));
    function select(v) { sel.property("value", v); onChange(v); }
    select(initial ?? options[0].value);
    return { select };
  }

  /** Legend placed over the map in its emptiest area. It is HTML (not SVG text) so its
   *  text stays 14px however small the map is drawn; on phones it moves under the map.
   *  MapKit.legend(svg, {
   *    x, y,                              // top-left corner, in the map's SVG (viewBox) units
   *    anchor: "bottom",                  // optional: (x, y) is the bottom-left corner instead
   *    align: "right", dx: -16,           // optional: (x, y) is the legend's right edge, shifted dx CSS px;
   *                                       //   e.g. x: 0, dx: -16 puts it in the empty space left of the map
   *    width,                             // in CSS px (default 200)
   *    title: "Longest walk ...",          // may contain \n for line breaks
   *    stops: [[value, color], ...],       // continuous gradient bar
   *    ticks: [[value, "label"], ...],
   *    keys:  [{cls, r, label} | {draw: g => ..., label}, ...]  // marks drawn in a 16px SVG around (0,0)
   *  })  -> returns the legend's d3 selection */
  function legend(svg, o) {
    const node = svg.node(), host = node.parentNode;
    const el = d3.select(host).append("div").attr("class", "legend").style("width", (o.width ?? 200) + "px");
    if (o.title) el.append("div").attr("class", "lg-title").html(o.title.split("\n").join("<br>"));
    if (o.stops) {
      const v0 = o.stops[0][0], v1 = o.stops[o.stops.length - 1][0], pct = v => (100 * (v - v0)) / (v1 - v0);
      el.append("div").attr("class", "lg-bar")
        .style("background", `linear-gradient(to right, ${o.stops.map(([v, c]) => `${c} ${pct(v)}%`).join(", ")})`);
      el.append("div").attr("class", "lg-ticks").selectAll("span").data(o.ticks || []).join("span")
        .attr("class", (_, i, a) => (i === 0 ? "" : i === a.length - 1 ? "end" : "mid"))
        .style("left", ([v]) => pct(v) + "%").text(([, label]) => label);
    }
    (o.keys || []).forEach(k => {
      const row = el.append("div").attr("class", "lg-key");
      const g = row.append("svg").attr("width", 16).attr("height", 16).attr("viewBox", "-8 -8 16 16").append("g");
      if (k.draw) k.draw(g);
      else g.append("circle").attr("class", k.cls).attr("r", k.r ?? 3);
      row.append("span").text(k.label);
    });
    // keep it pinned to (x, y) on the map as the SVG letterboxes and resizes
    function place() {
      if (getComputedStyle(el.node()).position !== "absolute") return;
      const vb = node.viewBox.baseVal, r = node.getBoundingClientRect(), h = host.getBoundingClientRect();
      const s = Math.min(r.width / vb.width, r.height / vb.height);
      const ox = r.left - h.left + (r.width - vb.width * s) / 2, oy = r.top - h.top + (r.height - vb.height * s) / 2;
      const top = oy + (o.y - vb.y) * s - (o.anchor === "bottom" ? el.node().offsetHeight : 0);
      const left = ox + (o.x - vb.x) * s + (o.dx ?? 0) - (o.align === "right" ? el.node().offsetWidth : 0);
      el.style("left", Math.max(0, left) + "px").style("top", top + "px");
    }
    new ResizeObserver(place).observe(node);
    new ResizeObserver(place).observe(el.node());  // content added after creation changes its height
    place();
    return el;
  }

  /** Easy hover for small point marks: finds the nearest point to the pointer (within `radius`
   *  screen px) so you don't have to land exactly on a tiny dot.
   *  MapKit.nearestHover(svg, points, {x: d => .., y: d => .., radius: 16,
   *                      transform: () => zoomTransform, onEnter(ev, d), onLeave()}) */
  function nearestHover(svg, points, o) {
    const node = svg.node(), radius = o.radius ?? 16;
    const delaunay = d3.Delaunay.from(points, o.x, o.y);
    let current = null;
    svg.on("pointermove.nearest", ev => {
      const t = o.transform ? o.transform() : d3.zoomIdentity;
      const vb = node.viewBox.baseVal, r = node.getBoundingClientRect();
      const unitsPerPx = 1 / Math.min(r.width / vb.width, r.height / vb.height);
      const [mx, my] = t.invert(d3.pointer(ev, node));
      const i = delaunay.find(mx, my), d = points[i];
      const dist = Math.hypot(o.x(d) - mx, o.y(d) - my) * t.k / unitsPerPx;  // screen px
      if (dist <= radius) { current = d; o.onEnter(ev, d); }
      else if (current) { current = null; o.onLeave(); }
    }).on("pointerleave.nearest", () => { if (current) { current = null; o.onLeave(); } });
  }

  window.MapKit = { tooltip, segmented, dropdown, legend, nearestHover };
})();
</script>
<script>
const D = window.DATA, ST = D.stats;
const tip = MapKit.tooltip();
const kind = d => (d.years == null ? "unknown" : d.basis);
const LABEL = { religious: "Religious", secular: "Secular" };

d3.select("#title").html(D.title.replace(". Secular", ".<br>Secular"));
d3.select("#lede").text(`${ST.n} American utopian communities founded ${ST.first}–${ST.last}, sized by how long each one lasted. ` +
  `Half the religious ones lasted ${ST.med_religious} years or more; half the secular ones lasted ${ST.med_secular} or fewer.`);
d3.select("#stat").text(`${ST.religious} religious · ${ST.secular} secular`);
d3.select("#method").text(D.method);
d3.select("#day").text(D.day);
d3.select("#census").attr("href", D.census);
{
  const links = D.sources.map(([l, u]) => `<a href="${u}">${l}</a>`);
  d3.select("#sources").html(`${links.slice(0, -1).join(", ")} and ${links.at(-1)}`);
}

function span(d) {
  if (d.start == null) return `Ended ${d.end}; founding year unknown`;
  if (d.active) return `${d.start}–today · ${d.years} years and counting`;
  if (d.end == null) return `Founded ${d.start}; end year unknown`;
  const y = d.years;
  return `${d.start}–${d.end} · ${y === 0 ? "under a year" : y === 1 ? "1 year" : y + " years"}`;
}
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Wikipedia's note for the community, cut at a sentence end so long ones don't fill the screen
function blurb(t, max = 260) {
  if (!t || t.length <= max) return t;
  const cut = t.slice(0, max + 1);
  const ends = [...cut.matchAll(/[.!?]["”’)]?(?=\s)/g)].map(m => m.index + m[0].length);  // sentence ends
  const end = ends.filter(i => i > 40).at(-1);
  return end ? cut.slice(0, end) : cut.slice(0, cut.lastIndexOf(" ")) + "…";
}
const tipHtml = d => `<b>${esc(d.name)}</b>${esc(d.place)}<br><span class="m">${LABEL[d.basis]} · ${esc(d.movement)}</span>` +
  `<br>${span(d)}${d.notes ? `<div class="note">${esc(blurb(d.notes))}</div>` : ""}`;

// ---------------- map view ----------------
const W = 960, H = 600;
const proj = d3.geoIdentity().reflectY(true).fitExtent([[8, 8], [W - 8, H - 8]], D.outline);
const path = d3.geoPath(proj);
const radius = y => D.rMin + (D.rMax - D.rMin) * Math.sqrt(Math.max(0, y ?? 0) / D.maxYears);
const pts = D.communities.map(d => { const [px, py] = proj([d.x, d.y]); return { ...d, px, py }; })
  .sort((a, b) => (b.years ?? -1) - (a.years ?? -1));   // big dots underneath small ones

const svg = d3.select("#map").append("svg").attr("viewBox", `0 0 ${W} ${H}`)
  .attr("preserveAspectRatio", "xMidYMid meet").attr("role", "img").attr("aria-label", D.title);
svg.append("g").selectAll("path").data(D.states.features).join("path").attr("class", "land").attr("d", path);
svg.append("path").datum(D.outline.features[0]).attr("class", "boundary").attr("d", path);
const dots = svg.append("g").selectAll("circle").data(pts).join("circle")
  .attr("class", d => `dot ${kind(d)}`).attr("cx", d => d.px).attr("cy", d => d.py)
  .attr("r", d => (d.years == null ? D.rMin * 0.8 : radius(d.years)));

MapKit.nearestHover(svg, pts, {
  x: d => d.px, y: d => d.py, radius: 16,
  onEnter(ev, d) { dots.classed("on", p => p === d); dots.filter(p => p === d).raise(); tip.show(ev, tipHtml(d)); },
  onLeave() { dots.classed("on", false); tip.hide(); },
});

function legendKeys() {
  return [
    { draw: g => g.append("circle").attr("class", "dot religious").attr("r", 6), label: "Religious" },
    { draw: g => g.append("circle").attr("class", "dot secular").attr("r", 6), label: "Secular" },
    { draw: g => g.append("circle").attr("class", "dot unknown").attr("r", 3), label: "Dates unknown" },
  ];
}
const mapLegend = MapKit.legend(svg, { x: 14, y: H - 10, anchor: "bottom", width: 230,
  title: "Each dot is one community", keys: legendKeys() });
// size key: rings on one baseline, drawn at the map's scale
const sk = mapLegend.append("div").attr("class", "lg-title").style("margin-top", "10px").text("Dot size: how long it lasted");
const scaleNow = () => { const r = svg.node().getBoundingClientRect(); return Math.min(r.width / W, r.height / H) || 1; };
const ringSvg = mapLegend.append("svg").attr("class", "size-key").attr("width", 230);
function drawRings() {
  // rings share a bottom line and are drawn at the map's current scale, so they match the dots
  const s = scaleNow(), rMax = radius(D.sizeKeys.at(-1)) * s, base = 2 * rMax + 2;
  ringSvg.selectAll("*").remove();
  ringSvg.attr("height", base + 20);
  let x = 2;
  D.sizeKeys.forEach((y, i) => {
    const r = radius(y) * s, slot = Math.max(2 * r, 34), last = i === D.sizeKeys.length - 1;
    ringSvg.append("circle").attr("class", "size-ring").attr("cx", x + slot / 2).attr("cy", base - r).attr("r", r);
    ringSvg.append("text").attr("x", last ? x + slot / 2 - 12 : x + slot / 2).attr("y", base + 17)
      .attr("text-anchor", last ? "start" : "middle")
      .attr("fill", "var(--muted)").style("font", "14px var(--font)")
      .text(i === D.sizeKeys.length - 1 ? `${y} years` : y);
    x += slot + 10;
  });
}
new ResizeObserver(drawRings).observe(svg.node());

// ---------------- timeline view (drawn at pixel size so text stays 14px) ----------------
const rows = D.communities.filter(d => d.start != null)
  .sort((a, b) => d3.ascending(a.start, b.start) || d3.ascending(a.name, b.name));
const tl = d3.select("#timeline");
const tsvg = tl.append("svg").attr("role", "img").attr("aria-label", "Timeline of each community, founding to end");
const tlLegend = tl.append("div").attr("class", "legend tl-legend").style("width", "230px");
tlLegend.append("div").attr("class", "lg-title").text("Each line is one community, founding to end");
legendKeys().forEach(k => {
  const row = tlLegend.append("div").attr("class", "lg-key");
  k.draw(row.append("svg").attr("width", 16).attr("height", 16).attr("viewBox", "-8 -8 16 16").append("g"));
  row.append("span").text(k.label);
});
tlLegend.append("div").attr("class", "lg-key lg-muted").text("▸ still running today");

function drawTimeline() {
  const node = tl.node(), w = node.clientWidth, h = node.clientHeight;
  if (!w || !h) return;
  const m = { t: 6, r: 18, b: 30, l: 8 };
  const x = d3.scaleLinear().domain([1730, D.now]).range([m.l, w - m.r]);
  const band = (h - m.t - m.b) / rows.length;
  const y = i => m.t + i * band;
  tsvg.selectAll("*").remove();
  const ax = tsvg.append("g").attr("class", "axis");
  const ticks = d3.range(1750, D.now, w < 500 ? 100 : 50);
  ax.selectAll("g.t").data(ticks).join("g").attr("class", "t").call(g => {
    g.append("line").attr("x1", x).attr("x2", x).attr("y1", m.t).attr("y2", h - m.b);
    g.append("text").attr("x", x).attr("y", h - m.b + 20).attr("text-anchor", "middle").text(d => d);
  });
  ax.append("g").attr("class", "now").call(g => {
    g.append("line").attr("x1", x(D.now)).attr("x2", x(D.now)).attr("y1", m.t).attr("y2", h - m.b);
    g.append("text").attr("x", x(D.now)).attr("y", h - m.b + 20).attr("text-anchor", "end").text("today");
  });
  const thick = Math.max(1.5, Math.min(6, band * 0.62));
  const g = tsvg.append("g").selectAll("g").data(rows).join("g").attr("class", "row");
  g.append("rect").attr("class", d => `bar ${kind(d)}`)
    .attr("x", d => x(d.start)).attr("y", (d, i) => y(i) + (band - thick) / 2).attr("height", thick)
    .attr("width", d => Math.max(thick, x(d.active ? D.now : (d.end ?? d.start)) - x(d.start)))
    .attr("rx", thick / 2);
  g.filter(d => d.active).append("path").attr("class", d => `arrow ${d.basis}`)
    .attr("d", (d, i) => { const cy = y(rows.indexOf(d)) + band / 2, a = Math.max(4, thick);
      return `M${x(D.now)},${cy - a} L${x(D.now) + a * 1.3},${cy} L${x(D.now)},${cy + a} Z`; });
  // full-width hit rows: hovering anywhere along a row picks that community
  g.append("rect").attr("class", "hit").attr("x", 0).attr("width", w)
    .attr("y", (d, i) => y(i)).attr("height", Math.max(band, 1))
    .on("pointermove", function (ev, d) { g.classed("on", r => r === d); tip.show(ev, tipHtml(d)); })
    .on("pointerleave", () => { g.classed("on", false); tip.hide(); });
}
new ResizeObserver(drawTimeline).observe(tl.node());

MapKit.segmented("#view", [{ value: "map", label: "Map" }, { value: "timeline", label: "Timeline" }], v => {
  d3.select("#map").attr("hidden", v === "map" ? null : true);
  d3.select("#timeline").attr("hidden", v === "timeline" ? null : true);
  tip.hide();
  if (v === "timeline") drawTimeline();
}, "map");
</script>
</body>
</html>
