<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompting Only</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Shared web theme for the #30DayMapChallenge series.
   Values mirror shared/tokens.json; change both together.
   Minimum text size on every page is 14px (legends, tooltips, controls); the footer credit line is 11px.
   Pages load Bitter (headlines) + Raleway (body) from Google Fonts (tokens.json font.web_css). */

:root {
  --bg: #ffffff; --ink: #2b2b28; --muted: #6b6b66; --edge: #ffffff; --closed: #8a8a86;
  --ctl: #f0efec; --ctl-on: #ffffff; --accent: #3987e5;
  --font: "Raleway", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  /* NYC subway trunk colors (tokens.json scales.subway) */
  --sub-123: #ee352e; --sub-456: #00933c; --sub-7: #b933ad; --sub-ACE: #0039a6; --sub-BDFM: #ff6319;
  --sub-G: #6cbe45; --sub-JZ: #996633; --sub-L: #a7a9ac; --sub-NQRW: #fccc0a; --sub-S: #808183; --sub-SIR: #1d5da8;
  --font-head: "Bitter", Georgia, "Times New Roman", serif;
  /* categorical (tokens.json scales.categorical_light / _dark): assign in this order, never cycle */
  /* confidence badge (tokens.json scales.confidence): very low -> high; same in light and dark */
  --conf-1: #cde2fb; --conf-2: #9ec5f4; --conf-3: #256abf; --conf-4: #0d366b;
  --conf-fg-1: #2b2b28; --conf-fg-2: #2b2b28; --conf-fg-3: #ffffff; --conf-fg-4: #ffffff;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #6250d6; --cat-8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b19; --ink: #ecebe6; --muted: #a3a29c; --edge: #1b1b19; --closed: #8f8e88;
    --ctl: #2c2c29; --ctl-on: #45453f;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b19; --ink: #ecebe6; --muted: #a3a29c; --edge: #1b1b19; --closed: #8f8e88;
  --ctl: #2c2c29; --ctl-on: #45453f;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
}

/* Aged-paper palette (tokens.json vintage). Use with <html data-palette="vintage" data-theme="light">. */
:root[data-palette="vintage"] {
  --bg: #f4ecd9; --ink: #3a2c1e; --muted: #6b5a45; --edge: #f4ecd9; --closed: #8f8674;
  --ctl: #e8dcc2; --ctl-on: #fbf6ea; --accent: #1c5a94; --land: #faf5e8; --water: #7f9aa3;
  --era-1: #8c2f22; --era-2: #d9695c; --era-3: #dfb02f; --era-4: #6f9a5e; --era-5: #74b4d4; --era-6: #1c5a94;
}

/* Aged-paper palette (tokens.json vintage). Use with <html data-palette="vintage" data-theme="light">. */
:root[data-palette="vintage"] {
  --bg: #f4ecd9; --ink: #3a2c1e; --muted: #6b5a45; --edge: #f4ecd9; --closed: #8f8674;
  --ctl: #e8dcc2; --ctl-on: #fbf6ea; --accent: #1c5a94; --land: #faf5e8; --water: #7f9aa3;
  --era-1: #8c2f22; --era-2: #d9695c; --era-3: #dfb02f; --era-4: #6f9a5e; --era-5: #74b4d4; --era-6: #1c5a94;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
       font-variant-numeric: lining-nums; }

/* ---- page layout: header / map that fills the rest of the viewport / footer ---- */
.page { height: 100dvh; display: flex; flex-direction: column;
        max-width: 1100px; margin: 0 auto; padding: 16px 16px 10px; }
.page > header { flex: none; text-align: center; }
.page h1 { font-size: clamp(22px, 2.8vw, 28px); line-height: 1.2; margin: 0 0 6px; font-weight: 700;
            font-family: var(--font-head); text-wrap: balance; }
.lede { color: var(--muted); margin: 0 auto 10px; max-width: 640px; text-wrap: balance; }
.map-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
.map-wrap > svg { width: 100%; height: 100%; display: block; }
.page > footer { flex: none; text-align: center; color: var(--muted); font-size: 11px;
                 margin-top: 6px; text-wrap: balance; }
.page > footer a { color: inherit; }
/* "← All maps" link added by publish.py: pinned top-left on wide screens, above the title on phones */
.home-link { position: fixed; top: 10px; left: 12px; z-index: 20; font: 600 14px/1 var(--font);
             color: var(--muted); text-decoration: none; padding: 6px 8px; border-radius: 6px; background: var(--bg); }
.home-link:hover { color: var(--ink); }
@media (max-width: 900px) {
  .home-link { position: static; display: inline-block; margin: 8px 0 0 8px; }
}
/* phones: let the page scroll and the map take its natural height */
@media (max-width: 640px), (max-height: 520px) {
  .page { height: auto; }
  .map-wrap > svg { height: auto; }
}

/* ---- controls ---- */
.controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 8px 14px; margin-bottom: 4px; }
.seg { display: inline-flex; background: var(--ctl); border-radius: 8px; padding: 3px; }
.seg button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0;
              padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ctl-on); color: var(--ink); font-weight: 600;
                                   box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stat { color: var(--muted); font-size: 14px; }
/* dropdown (MapKit.dropdown): same surface as the segmented toggle, chevron drawn in CSS */
.dd { position: relative; display: inline-block; }
.dd select { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--ctl);
             border: 0; border-radius: 8px; padding: 8px 34px 8px 12px; cursor: pointer;
             appearance: none; -webkit-appearance: none; max-width: 100%; }
.dd select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dd::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; margin-top: -6px;
             border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); pointer-events: none; }
/* play / pause button for animated maps: same surface as the toggle; put an icon <svg> before the label */
.play { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--ctl);
        border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; display: inline-flex; gap: 8px;
        align-items: center; }
.play:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.play svg { fill: currentColor; }
/* the current value of an animated control (a clock, a date), in the headline face */
.readout { font: 700 20px/1 var(--font-head); }

/* ---- map marks ---- */
.cell { stroke: var(--edge); stroke-width: 0.5; }
.cell:hover { stroke: var(--ink); stroke-width: 1.5; }
.boundary { fill: none; stroke: var(--ink); stroke-width: 0.5; pointer-events: none; }
.pt { fill: var(--ink); pointer-events: none; }
.closed { fill: var(--closed); stroke: var(--bg); stroke-width: 1; }

/* ---- in-map legend (HTML overlay placed over the map by MapKit.legend, so text stays 14px) ---- */
.legend { position: absolute; z-index: 2; font-size: 14px; line-height: 1.3; color: var(--ink); pointer-events: none; }
.legend .lg-title { font-weight: 600; }
.legend .lg-bar { height: 12px; border-radius: 2px; margin-top: 6px; }
.legend .lg-ticks { position: relative; height: 22px; }
.legend .lg-ticks span { position: absolute; top: 0; padding-top: 5px; white-space: nowrap; }
.legend .lg-ticks span::before { content: ""; position: absolute; top: 0; left: 0; width: 1px; height: 4px; background: var(--muted); }
.legend .lg-ticks span.mid { transform: translateX(-50%); }
.legend .lg-ticks span.mid::before { left: 50%; }
.legend .lg-ticks span.end { transform: translateX(-100%); }
.legend .lg-ticks span.end::before { left: auto; right: 0; }
.legend .lg-key { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
.legend .lg-key svg { flex: none; overflow: visible; }
.legend .lg-muted { color: var(--muted); }
/* phones: the legend sits under the map instead of on it */
@media (max-width: 640px) { .legend { position: static; margin-top: 8px; } }

/* ---- tooltip ---- */
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--bg); color: var(--ink);
       border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); border-radius: 6px;
       padding: 8px 10px; font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.12);
       max-width: 260px; opacity: 0; transition: opacity .1s; }
.tip b { display: block; margin-bottom: 2px; }
.tip .m { color: var(--muted); }
</style>
<style>
  .lede { max-width: none; }   /* day 10 only: let the intro run the full width (shared theme caps it at 640px) */
  .land { fill: color-mix(in srgb, var(--ink) 9%, var(--bg)); stroke: var(--bg); stroke-width: .6; vector-effect: non-scaling-stroke; }
  .link { stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .guess { fill: var(--cat-1); fill-opacity: .55; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .truth { fill: var(--ink); }
  .hit { fill: transparent; cursor: pointer; }
  .pick .guess { fill-opacity: .8; stroke-width: 2; }

  /* distance labels sit on their line (HTML, so they stay 14px at any zoom) */
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .dl { position: absolute; left: 0; top: 0; font-weight: 600; font-size: 14px; line-height: 1; white-space: nowrap;
        padding: 2px 5px; border-radius: 4px; background: var(--bg); color: var(--ink); transform-origin: 0 0; }

  /* confidence badge: ordinal scale, very low -> high (tokens.json scales.confidence) */
  .badge { display: inline-block; font-weight: 600; font-size: 14px; line-height: 1; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
  .badge[data-c="very low"] { background: var(--conf-1); color: var(--conf-fg-1); }
  .badge[data-c="low"]      { background: var(--conf-2); color: var(--conf-fg-2); }
  .badge[data-c="medium"]   { background: var(--conf-3); color: var(--conf-fg-3); }
  .badge[data-c="high"]     { background: var(--conf-4); color: var(--conf-fg-4); }

  /* map + side panel */
  .stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 18px; }
  .stage .map-wrap { flex: 1 1 auto; min-width: 0; }
  .panel { flex: 0 0 290px; overflow-y: auto; padding: 4px 0 4px 18px; border-left: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
  .panel h2 { font: 700 20px/1.2 var(--font-head); margin: 0; }
  .panel p { margin: 6px 0 0; }
  .panel .m, .tip .m { color: var(--muted); }
  .panel .big { font: 700 30px/1.1 var(--font-head); margin: 12px 0 8px; }
  .panel .row { margin-top: 12px; }
  .panel .k { display: block; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .panel .keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font: inherit; font-size: 14px; color: var(--ink); background: var(--ctl); border: 0; border-radius: 8px;
          padding: 6px 10px; margin: 6px 6px 0 0; cursor: pointer; text-align: left; }
  .chip:hover { background: var(--ctl-on); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (max-width: 640px) {
    .stage { flex-direction: column; }
    .panel { flex: none; border-left: 0; padding: 12px 0 0; }
  }

  #try { display: inline-flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #try input { font: inherit; font-size: 14px; color: var(--ink); background: var(--ctl); border: 0; border-radius: 8px; padding: 9px 12px; width: 170px; }
  #try input::placeholder { color: var(--muted); }
  #try input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .play:disabled { opacity: .6; cursor: default; }
  .reset { position: absolute; top: 8px; right: 8px; z-index: 3; padding: 8px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.18); visibility: hidden; }
  .reset.on { visibility: visible; }
  .info { position: absolute; top: 8px; left: 8px; z-index: 3; width: 38px; height: 38px; padding: 0; display: grid; place-items: center;
          border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  #notes { position: absolute; top: 54px; left: 8px; z-index: 4; width: min(380px, calc(100% - 16px)); background: var(--bg); color: var(--ink);
           border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); border-radius: 8px; padding: 12px 14px 4px;
           box-shadow: 0 2px 10px rgba(0,0,0,.14); font-size: 14px; }
  #notes p { margin: 0 0 8px; }
  #notes p:empty { display: none; }
  #notes b { font-weight: 600; }
</style>

<body>
<a class="home-link" href="../">&larr; All maps</a>
<div class="page">
  <header>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="controls">
      <form id="try" hidden>
        <input name="place" placeholder="Place, e.g. Kearney" required maxlength="80" autocomplete="off" aria-label="Place name">
        <input name="country" placeholder="Country" required maxlength="60" autocomplete="off" aria-label="Country">
        <button class="play" type="submit">Ask Claude</button>
      </form>
    </div>
  </header>
  <div class="stage">
    <div class="map-wrap" id="map">
      <button class="play info" id="info" type="button" aria-label="About this map: method, data and credits" aria-expanded="false" aria-controls="notes">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="5.3" r="1.1" fill="currentColor"/></svg>
      </button>
      <div id="notes" role="note" hidden>
        <p><b>How it's measured.</b> Distance is the geodesic from Claude's guess to the real location. Lines are drawn straight on the map.</p>
        <p><b>Data.</b> <span id="source"></span></p>
        <p id="miss"></p>
        <p id="visitors"></p>
        <p>#30DayMapChallenge <span id="day"></span></p>
      </div>
      <button class="play reset" id="reset" type="button" aria-label="Show the whole world">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Reset view
      </button>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

ct":40,"why":"Recall a tiny community on US-93 in the Salmon River valley of east-central Idaho, between Salmon (about 45.2N, 113.9W) and Challis (about 44.5N, 114.2W), but not which county. Put it roughly a third of the way from Salmon to Challis at 44.8N, 113.9W. Mostly interpolated from the two towns I know better.","src":"USGS GNIS via roadsidethoughts.com"},{"place":"Canoe River","admin":"British Columbia","country":"Canada","glat":52.7,"glon":-119.2,"tlat":52.7331,"tlon":-119.2,"g":[-9218819.8,6272347.3],"t":[-9221421.9,6275560.4],"km":5.9,"conf":"low","pct":40,"why":"Remember a Canoe River in eastern British Columbia, in the Robson Valley near Valemount (about 52.8N, 119.3W) and the Yellowhead Highway and rail line toward Jasper, and as the river that runs into the Columbia. Put it a little south of Valemount at 52.7N, 119.2W. Not sure whether this is the river, a rail point or a settlement, so the exact spot is a guess.","src":"BC Geographical Names (population centre, S of T\u00eate Jaune Cache)"},{"place":"Concepci\u00f3n P\u00e1palo","admin":"Oaxaca","country":"Mexico","glat":17.85,"glon":-96.9,"tlat":17.85,"tlon":-96.867,"g":[-9078921.0,2286750.9],"t":[-9075829.1,2286750.9],"km":3.5,"conf":"low","pct":45,"why":"Know it as a small mountain town in northern Oaxaca, in the Ca\u00f1ada region near Cuicatl\u00e1n (about 17.8N, 96.95W) and the Sierra Mazateca, and that there is also a Santos Reyes P\u00e1palo close by. Put it a little north and east of Cuicatl\u00e1n at 17.85N, 96.90W. The state and region are fairly solid; the exact point is interpolated from Cuicatl\u00e1n.","src":"Wikipedia"},{"place":"S\u00e3o F\u00e9lix do Xingu","admin":"Par\u00e1","country":"Brazil","glat":-6.64,"glon":-51.98,"tlat":-6.6333,"tlon":-51.9833,"g":[-4969263.2,-856942.5],"t":[-4969610.9,-856079.9],"km":0.8,"conf":"high","pct":80,"why":"Know it as a large municipality in southern Par\u00e1, on the Xingu river, known for cattle ranching and deforestation. Remember it as roughly 6.6S, 52W, south of Altamira (about 3.2S, 52.2W) and well east of the Tapaj\u00f3s. The town itself sits on the river, so I put it at 6.64S, 51.98W. Fairly confident, though the town center could be a few km from my point.","src":"Wikipedia"},{"place":"Lefors","admin":"Texas","country":"USA","glat":35.44,"glon":-100.8,"tlat":35.4396,"tlon":-100.8,"g":[-8800120.3,4422121.0],"t":[-8800480.0,4422074.8],"km":0.4,"conf":"medium","pct":60,"why":"Knew it as a tiny Gray County town in the Texas Panhandle, southeast of Pampa. Started from Pampa (about 35.5N, 101.0W) and nudged southeast. The numbers were probably recalled rather than computed.","src":"USGS GNIS"}],"unresolved":["Heteranta"],"near":25,"title":"Claude put 5 of 8 places within 25 km from memory, but placed Bakhanay 343 km from where it is","page_title":"How well does Claude know where places are?","day":"Day 10: Prompting only","source":"Data: Claude's memory-only guesses vs. USGS GNIS, BC Geographical Names, Wikipedia and OpenStreetMap \u00b7 Map: Natural Earth","worker":"https://day10-claude-geo-guess.daniellecarrick.workers.dev"};</script>

<script>
/* Shared web components for the #30DayMapChallenge series. Needs d3 v7 loaded first.
   window.MapKit = { tooltip, segmented, dropdown, legend, nearestHover } */
(function () {
  /** Tooltip: const tip = MapKit.tooltip(); tip.show(event, html); tip.hide(); */
  function tooltip() {
    const el = d3.select("body").append("div").attr("class", "tip");
    return {
      show(ev, html) {
        el.html(html).style("opacity", 1);
        const h = el.node().offsetHeight, below = ev.clientY + 14 + h <= innerHeight;  // flip above the pointer near the bottom
        const w = el.node().offsetWidth;   // keep the whole tip on screen, however wide a page lets it get
        el.style("left", Math.max(4, Math.min(ev.clientX + 14, innerWidth - w - 8)) + "px")
          .style("top", (below ? ev.clientY + 14 : Math.max(4, ev.clientY - 14 - h)) + "px");
      },
      hide() { el.style("opacity", 0); },
    };
  }

  /** Segmented toggle.
   *  MapKit.segmented("#toggle", [{value: "all", label: "All"}, ...], value => render(value), "all") */
  function segmented(target, options, onChange, initial) {
    const root = d3.select(target).attr("class", "seg").attr("role", "group");
    const btns = root.selectAll("button").data(options).join("button")
      .attr("type", "button").text(d => d.label)
      .on("click", (_, d) => select(d.value));
    function select(v) {
      btns.attr("aria-pressed", d => d.value === v);
      onChange(v);
    }
    select(initial ?? options[0].value);
    return { select };
  }

  /** Dropdown, for when there are too many views for a segmented toggle (more than ~6).
   *  MapKit.dropdown("#pick", [{value, label, group?}, ...], value => render(value), initial, "Cuisine")
   *  Options with a `group` are put under <optgroup> headings in first-seen order. Returns { select }. */
  function dropdown(target, options, onChange, initial, ariaLabel) {
    const root = d3.select(target).attr("class", "dd");
    const sel = root.append("select").attr("aria-label", ariaLabel ?? null);
    const groups = d3.groups(options, d => d.group ?? "");
    for (const [name, opts] of groups) {
      const parent = name ? sel.append("optgroup").attr("label", name) : sel;
      parent.selectAll("option.o").data(opts).join("option").attr("class", "o")
        .attr("value", d => d.value).text(d => d.label);
    }
    sel.on("change", () => onChange(sel.property("value")));
    function select(v) { sel.property("value", v); onChange(v); }
    select(initial ?? options[0].value);
    return { select };
  }

  /** Legend placed over the map in its emptiest area. It is HTML (not SVG text) so its
   *  text stays 14px however small the map is drawn; on phones it moves under the map.
   *  MapKit.legend(svg, {
   *    x, y,                              // top-left corner, in the map's SVG (viewBox) units
   *    anchor: "bottom",                  // optional: (x, y) is the bottom-left corner instead
   *    align: "right", dx: -16,           // optional: (x, y) is the legend's right edge, shifted dx CSS px;
   *                                       //   e.g. x: 0, dx: -16 puts it in the empty space left of the map
   *    width,                             // in CSS px (default 200)
   *    title: "Longest walk ...",          // may contain \n for line breaks
   *    stops: [[value, color], ...],       // continuous gradient bar
   *    ticks: [[value, "label"], ...],
   *    keys:  [{cls, r, label} | {draw: g => ..., label}, ...]  // marks drawn in a 16px SVG around (0,0)
   *  })  -> returns the legend's d3 selection */
  function legend(svg, o) {
    const node = svg.node(), host = node.parentNode;
    const el = d3.select(host).append("div").attr("class", "legend").style("width", (o.width ?? 200) + "px");
    if (o.title) el.append("div").attr("class", "lg-title").html(o.title.split("\n").join("<br>"));
    if (o.stops) {
      const v0 = o.stops[0][0], v1 = o.stops[o.stops.length - 1][0], pct = v => (100 * (v - v0)) / (v1 - v0);
      el.append("div").attr("class", "lg-bar")
        .style("background", `linear-gradient(to right, ${o.stops.map(([v, c]) => `${c} ${pct(v)}%`).join(", ")})`);
      el.append("div").attr("class", "lg-ticks").selectAll("span").data(o.ticks || []).join("span")
        .attr("class", (_, i, a) => (i === 0 ? "" : i === a.length - 1 ? "end" : "mid"))
        .style("left", ([v]) => pct(v) + "%").text(([, label]) => label);
    }
    (o.keys || []).forEach(k => {
      const row = el.append("div").attr("class", "lg-key");
      const g = row.append("svg").attr("width", 16).attr("height", 16).attr("viewBox", "-8 -8 16 16").append("g");
      if (k.draw) k.draw(g);
      else g.append("circle").attr("class", k.cls).attr("r", k.r ?? 3);
      row.append("span").text(k.label);
    });
    // keep it pinned to (x, y) on the map as the SVG letterboxes and resizes
    function place() {
      if (getComputedStyle(el.node()).position !== "absolute") return;
      const vb = node.viewBox.baseVal, r = node.getBoundingClientRect(), h = host.getBoundingClientRect();
      const s = Math.min(r.width / vb.width, r.height / vb.height);
      const ox = r.left - h.left + (r.width - vb.width * s) / 2, oy = r.top - h.top + (r.height - vb.height * s) / 2;
      const top = oy + (o.y - vb.y) * s - (o.anchor === "bottom" ? el.node().offsetHeight : 0);
      const left = ox + (o.x - vb.x) * s + (o.dx ?? 0) - (o.align === "right" ? el.node().offsetWidth : 0);
      el.style("left", Math.max(0, left) + "px").style("top", top + "px");
    }
    new ResizeObserver(place).observe(node);
    new ResizeObserver(place).observe(el.node());  // content added after creation changes its height
    place();
    return el;
  }

  /** Easy hover for small point marks: finds the nearest point to the pointer (within `radius`
   *  screen px) so you don't have to land exactly on a tiny dot.
   *  MapKit.nearestHover(svg, points, {x: d => .., y: d => .., radius: 16,
   *                      transform: () => zoomTransform, onEnter(ev, d), onLeave()}) */
  function nearestHover(svg, points, o) {
    const node = svg.node(), radius = o.radius ?? 16;
    const delaunay = d3.Delaunay.from(points, o.x, o.y);
    let current = null;
    svg.on("pointermove.nearest", ev => {
      const t = o.transform ? o.transform() : d3.zoomIdentity;
      const vb = node.viewBox.baseVal, r = node.getBoundingClientRect();
      const unitsPerPx = 1 / Math.min(r.width / vb.width, r.height / vb.height);
      const [mx, my] = t.invert(d3.pointer(ev, node));
      const i = delaunay.find(mx, my), d = points[i];
      const dist = Math.hypot(o.x(d) - mx, o.y(d) - my) * t.k / unitsPerPx;  // screen px
      if (dist <= radius) { current = d; o.onEnter(ev, d); }
      else if (current) { current = null; o.onLeave(); }
    }).on("pointerleave.nearest", () => { if (current) { current = null; o.onLeave(); } });
  }

  window.MapKit = { tooltip, segmented, dropdown, legend, nearestHover };
})();
</script>
<script>
const D = window.DATA;
const WORKER = (D.worker || "").replace(/\/$/, "");
const W = 1000, H = 520;
const proj = d3.geoIdentity().reflectY(true).fitExtent([[6, 6], [W - 6, H - 6]], D.land);
const path = d3.geoPath(proj);
const tip = MapKit.tooltip();
const R = km => 3 + 0.5 * Math.sqrt(km);
const fmt = km => km < 10 ? km.toFixed(1) : Math.round(km).toLocaleString();
const ll = (a, b) => `${Math.abs(a).toFixed(2)}° ${a < 0 ? "S" : "N"}, ${Math.abs(b).toFixed(2)}° ${b < 0 ? "W" : "E"}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const badge = d => `<span class="badge" data-c="${esc(d.conf)}">${esc(d.conf)} confidence</span>`;
const shortName = n => n.split(",").slice(0, 3).join(",");

// Equal Earth, spherical (R = 6378137): the same projection build.py used for the land and the curated points
function eqearth(lon, lat) {
  const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796, M = Math.sqrt(3) / 2, r = Math.PI / 180;
  const th = Math.asin(M * Math.sin(lat * r)), t2 = th * th, t6 = t2 * t2 * t2;
  return [6378137 * lon * r * Math.cos(th) / (M * (A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2))),
          6378137 * th * (A1 + A2 * t2 + t6 * (A3 + A4 * t2))];
}
const toPlace = (r, visitor) => { const g = eqearth(r.glon, r.glat), t = eqearth(r.tlon, r.tlat);
  return { ...r, admin: r.admin ?? "", visitor, g, t, gp: proj(g), tp: proj(t) }; };

d3.select("#title").text(D.page_title);
d3.select("#lede").text(WORKER
  ? "Type any place and country. Claude guesses its latitude and longitude from memory alone, no web, then we check the guess against the real coordinates. Each circle is a guess; the dot is where the place really is."
  : "Claude was given only a place name and country, no web, and guessed the latitude and longitude from memory. Each circle is a guess; the dot is where the place really is.");
d3.select("#source").text(D.source.replace(/^Data: /, ""));
d3.select("#day").text(D.day);
if (D.unresolved.length) d3.select("#miss").text(`${D.unresolved.join(", ")} could not be found in any gazetteer, so it is left off the map.`);

const svg = d3.select("#map").append("svg").attr("viewBox", `0 0 ${W} ${H}`)
  .attr("preserveAspectRatio", "xMidYMid meet").attr("role", "img").attr("aria-label", D.title);
const root = svg.append("g");
root.append("g").selectAll("path").data(D.land.features).join("path").attr("class", "land").attr("d", path);
const layer = root.append("g");
const labelLayer = d3.select("#map").append("div").attr("id", "labels");

let P = D.places.map(d => ({ ...d, visitor: false, gp: proj(d.g), tp: proj(d.t) }));
let items, k = 1, picked = null, lg;   // lg: the legend, hidden while zoomed in so it never sits on the line
const key = d => `${d.place}|${d.country}|${d.glat}|${d.tlat}`;

function headline() {
  const n = P.length, near = P.filter(d => d.km <= D.near).length, w = P.reduce((a, b) => b.km > a.km ? b : a);
  return `Claude put ${near} of ${n} places within ${D.near} km from memory, but placed ${w.place} ${Math.round(w.km)} km from where it is`;
}
function sizes() {
  items.select(".guess").attr("r", d => R(d.km) / k);
  items.select(".truth").attr("r", 2.6 / k);
  items.select(".g-hit").attr("r", d => Math.max(R(d.km), 14) / k);
  items.select(".t-hit").attr("r", 12 / k);
}

// Distance label on each line, shown only where the line is long enough on screen to hold it
function placeLabels() {
  const host = document.getElementById("map").getBoundingClientRect(), m = root.node().getScreenCTM();
  if (!m) return;
  const at = p => { const q = new DOMPoint(p[0], p[1]).matrixTransform(m); return [q.x - host.left, q.y - host.top]; };
  labelLayer.selectAll("div.dl").each(function (d) {
    const a = at(d.gp), b = at(d.tp), dx = b[0] - a[0], dy = b[1] - a[1];
    const text = `${fmt(d.km)} km`, w = text.length * 8.5 + 10;
    const ok = Math.hypot(dx, dy) >= w + 2 * (R(d.km) + 4);     // fits between the two marks
    this.style.display = ok ? "" : "none";
    if (!ok) return;
    let ang = Math.atan2(dy, dx) * 180 / Math.PI; if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
    this.textContent = text;
    this.style.transform = `translate(${(a[0] + b[0]) / 2}px, ${(a[1] + b[1]) / 2}px) rotate(${ang}deg) translate(-50%, -50%)`;
  });
}
function draw() {
  P.sort((a, b) => b.km - a.km);   // biggest first, so small circles sit on top
  items = layer.selectAll("g.item").data(P, key).join(enter => {
    const g = enter.append("g").attr("class", "item");
    g.append("line").attr("class", "link"); g.append("circle").attr("class", "guess"); g.append("circle").attr("class", "truth");
    g.append("circle").attr("class", "hit g-hit"); g.append("circle").attr("class", "hit t-hit");
    return g;
  }).order();
  items.select(".link").attr("x1", d => d.gp[0]).attr("y1", d => d.gp[1]).attr("x2", d => d.tp[0]).attr("y2", d => d.tp[1]);
  items.selectAll(".guess, .g-hit").attr("cx", d => d.gp[0]).attr("cy", d => d.gp[1]);
  items.selectAll(".truth, .t-hit").attr("cx", d => d.tp[0]).attr("cy", d => d.tp[1]);
  items.classed("pick", d => d === picked);
  sizes();
  labelLayer.selectAll("div.dl").data(P, key).join("div").attr("class", "dl");
  placeLabels();
  items.on("click", (ev, d) => select(d));
  items.selectAll(".hit").on("mousemove", (ev, d) => tip.show(ev, tipHtml(d))).on("mouseleave", tip.hide);
  const t = headline();
  svg.attr("aria-label", t); d3.select("#sofar").text(t);
  const v = P.filter(d => d.visitor || d.added).length;
  d3.select("#visitors").text(v ? `${v} of the ${P.length} places ${v === 1 ? "was" : "were"} added by visitors.` : "");
}

const zoom = d3.zoom().scaleExtent([1, 60]).filter(ev => ev.type === "mousedown" || ev.type === "touchstart")
  .on("zoom", ev => { k = ev.transform.k; root.attr("transform", ev.transform); sizes(); placeLabels(); });
svg.call(zoom);
new ResizeObserver(placeLabels).observe(svg.node());

// ---------- side panel ----------
const panelEl = d3.select("#panel");
const panel = html => panelEl.html(html);
function idle() {
  picked = null; items && items.classed("pick", false);
  panel(`<h2>Why did Claude guess there?</h2>
    <p>${WORKER ? "Click a circle to read Claude's reasoning, or type a place above to see where Claude thinks it is." : "Click a circle to read Claude's reasoning."}</p>
    <div class="row"><span class="k">So far</span><span id="sofar">${esc(headline())}</span></div>
    <div class="row"><span class="k">Claude's confidence in each guess</span>
      <div class="keys">${["very low", "low", "medium", "high"].map(c => `<span class="badge" data-c="${c}">${c}</span>`).join("")}</div></div>`);
}
function select(d) {
  picked = d;
  items.classed("pick", p => p === d);
  const [x0, y0] = d.gp, [x1, y1] = d.tp;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const kk = Math.max(5, Math.min(45, 0.35 * Math.min(W / Math.max(dx, 1), H / Math.max(dy, 1))));
  svg.transition().duration(700).call(zoom.transform,
    d3.zoomIdentity.translate(W / 2 - kk * (x0 + x1) / 2, H / 2 - kk * (y0 + y1) / 2).scale(kk));
  const alts = (d.cands || []).map((c, i) => ({ c, i })).filter(a => a.i !== d.ci);
  panel(`<h2>${esc(d.place)}</h2>
    <span class="m">${esc([d.admin, d.country].filter(Boolean).join(", "))}</span>
    <div class="big">${fmt(d.km)} km off</div>
    ${badge(d)} <span class="m">${d.pct}% sure of within ${D.near} km</span>
    <div class="row"><span class="k">Why Claude guessed there</span>${esc(d.why)}</div>
    <div class="row"><span class="k">Claude's guess</span>${ll(d.glat, d.glon)}</div>
    <div class="row"><span class="k">Actual location</span>${ll(d.tlat, d.tlon)}${d.true_name ? `<br><span class="m">${esc(d.true_name)}</span>` : ""}</div>
    ${alts.length ? `<div class="row"><span class="k">Not the place you meant?</span><div class="alts"></div></div>` : ""}`);
  if (alts.length) {
    const box = panelEl.select(".alts");
    alts.forEach(a => box.append("button").attr("type", "button").attr("class", "chip").text(shortName(a.c.name)).on("click", () => rescore(d, a.i)));
    box.append("button").attr("type", "button").attr("class", "chip").text("None of these, remove it").on("click", () => rescore(d, -1));
  }
  d3.select("#reset").classed("on", true);
  lg && lg.style("visibility", "hidden");
}
function home() {
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
  idle();
  d3.select("#reset").classed("on", false);
  lg && lg.style("visibility", null);
}
d3.select("#reset").on("click", home);

// about / credits popover
const infoBtn = document.getElementById("info"), notes = document.getElementById("notes");
const toggleNotes = open => { notes.hidden = !open; infoBtn.setAttribute("aria-expanded", open); };
infoBtn.addEventListener("click", ev => { ev.stopPropagation(); toggleNotes(notes.hidden); });
document.addEventListener("click", ev => { if (!notes.hidden && !notes.contains(ev.target)) toggleNotes(false); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !notes.hidden) { toggleNotes(false); infoBtn.focus(); } });

function tipHtml(d) {
  return `<b>${esc(d.place)}, ${esc(d.country)}</b>${fmt(d.km)} km off<br>${badge(d)}
    <span class="m"><br>Guess ${ll(d.glat, d.glon)}<br>Actual ${ll(d.tlat, d.tlon)}${d.visitor ? "<br>Added by a visitor" : ""}</span>`;
}

draw();
idle();

// ---------- live guessing (needs the Cloudflare Worker in worker/) ----------
async function api(p, body) {
  let r;
  try { r = await fetch(WORKER + p, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}); }
  catch { throw Object.assign(new Error("Check your connection and try again."), { code: "network" }); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Request failed."), { code: j.code || "error" });
  return j;
}
const ERR_HEAD = { rate_limit: "You've used your guesses", daily_limit: "Claude needs a rest", credits: "Guessing is paused",
  key: "Guessing is paused", busy: "Claude is busy", network: "Can't reach the guessing service" };
const showError = e => panel(`<h2>${esc(ERR_HEAD[e.code] || "Something went wrong")}</h2><p>${esc(e.message)}</p>`);

// Score a guess against candidate `index` (-1 = remove it). Replaces any earlier scoring of the same guess.
async function finish(g, index) {
  const c = await api("/confirm", { id: g.id, index });
  P = P.filter(d => d.gid !== g.id);
  if (!c.saved) { picked = null; draw(); return idle(); }
  const p = { ...toPlace(c.row, true), added: true, gid: g.id, cands: g.candidates, ci: index };
  P.push(p); draw(); select(p);
}
async function rescore(d, index) {
  try { await finish({ id: d.gid, candidates: d.cands }, index); }
  catch (e) { showError(e); }
}
if (WORKER) {
  d3.select("#try").attr("hidden", null);
  api("/dataset").then(j => { P = P.concat(j.places.map(r => ({ ...toPlace(r, true), added: true }))); draw(); }).catch(() => {});

  const form = document.getElementById("try"), btn = form.querySelector("button");
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const place = form.place.value.trim(), country = form.country.value.trim();
    btn.disabled = true;
    panel(`<h2>Asking Claude…</h2><p>Where is <b>${esc(place)}, ${esc(country)}</b>?</p>`);
    try {
      const g = await api("/guess", { place, country });
      if (g.candidates.length) {
        await finish(g, 0);   // best match first; the panel offers the others if it picked the wrong one
      } else {
        panel(`<h2>${esc(place)}</h2><span class="m">${esc(country)}</span>
          <p>Claude guessed ${ll(g.guess.lat, g.guess.lon)}, but I couldn't find that place on OpenStreetMap, so there's nothing to score it against. Try a different spelling.</p>
          <div class="row"><span class="k">Why Claude guessed there</span>${esc(g.guess.reasoning)}</div>`);
      }
    } catch (e) { showError(e); }
    btn.disabled = false;
  });
}

lg = MapKit.legend(svg, {
  x: 12, y: H - 12, anchor: "bottom", width: 250,
  keys: [
    { draw: g => g.append("circle").attr("class", "guess").attr("r", 6), label: "Claude's guess (bigger = farther off)" },
    { draw: g => g.append("circle").attr("class", "truth").attr("r", 3), label: "Actual location" },
  ],
});
</script>
</body>
