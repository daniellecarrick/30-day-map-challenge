<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feeling Place Names</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<!-- build.py inlines these three so out/feeling_places.html is a single file -->
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  .page { max-width: 1200px; }
  /* the two sides of each view: the series' diverging ends (lighter blue in dark mode so it reads) */
  :root { --lo: var(--div-1); --hi: var(--div-4); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lo: var(--div-2); } }
  :root[data-theme="dark"] { --lo: var(--div-2); }

  .land { fill: var(--ctl); stroke: var(--bg); stroke-width: 0.8; vector-effect: non-scaling-stroke; }
  .dot { stroke: var(--bg); stroke-width: 0.4; pointer-events: none; transition: opacity .15s;
         vector-effect: non-scaling-stroke; }
  .map-wrap > svg { cursor: grab; }
  .map-wrap > svg:active { cursor: grabbing; }
  /* when zoomed, dots slide under the legend and the zoom control, so both get a paper backing */
  .legend { background: color-mix(in srgb, var(--bg) 90%, transparent); padding: 6px 10px 8px; border-radius: 6px; }
  .zoom-ctl { position: absolute; right: 6px; top: 4px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .zoom-hint { color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--bg) 90%, transparent);
               padding: 2px 6px; border-radius: 4px; }
  .zoom-reset { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--ctl);
                border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .zoom-reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (max-width: 640px) {
    .legend { background: none; padding: 0; }
    .zoom-ctl { position: static; justify-content: flex-end; margin-bottom: 4px; }
  }
  .lo { fill: var(--lo); }
  .hi { fill: var(--hi); }
  .dots.focus .dot:not(.on) { opacity: .25; }
  .ring { fill: none; stroke: var(--ink); stroke-width: 1.5; pointer-events: none; vector-effect: non-scaling-stroke; }
  .tip .word { font-weight: 600; }
  .tip .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 6px 0 3px; }
  .tip .bar span { display: block; }
  .legend .lg-count { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="map-wrap" id="map"><div class="zoom-ctl"><span class="zoom-hint" id="zoom-hint">Scroll or pinch to zoom</span><button type="button" class="zoom-reset" id="zoom-reset" hidden>Reset zoom</button></div></div>
  <footer>Whole-word match on feeling words (Pleasant, Hope, Lonesome, Misery…) in the names of every lake, stream, spring, peak, valley and town; places marked historical left out.
    Data: <a id="src">USGS Geographic Names Information System</a> (Nov 2026) · #30DayMapChallenge <span id="day"></span></footer>
</div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="../../shared/components.js"></script>
<script>
const D = window.DATA;
const tip = MapKit.tooltip();
d3.select("#src").attr("href", D.source_url);
d3.select("#day").text(D.day);

// points: [lon, lat, name, classIdx, state, county, word, side(0 good, 1 bad)]
const STATE = new Map(D.states.features.map(f => [f.properties.STUSPS, f.properties.NAME]));
const W = 975, H = 610;
const proj = d3.geoAlbersUsa().fitExtent([[8, 8], [W - 8, H - 8]], D.states);
const path = d3.geoPath(proj);
const pts = D.points.map(p => {
  const xy = proj([p[0], p[1]]);
  return xy && { x: xy[0], y: xy[1], name: p[2], cls: D.classes[p[3]], st: p[4], county: p[5],
                 word: p[6], side: p[7] ? "hi" : "lo" };
}).filter(Boolean);

const svg = d3.select("#map").append("svg").attr("viewBox", `0 0 ${W} ${H}`)
  .attr("preserveAspectRatio", "xMidYMid meet").attr("role", "img");
const gZoom = svg.append("g");
gZoom.append("g").selectAll("path").data(D.states.features).join("path").attr("class", "land").attr("d", path);
const gDots = gZoom.append("g").attr("class", "dots");
const ring = gZoom.append("circle").attr("class", "ring").attr("r", 5).style("display", "none");

// ---- zoom: wheel / trackpad / pinch; on phones one finger still scrolls the page ----
const R = 2.6;
let zt = d3.zoomIdentity;
const dotR = k => (R * Math.pow(k, 0.35)) / k;   // dots grow a little as you zoom in, not with the map
const zoom = d3.zoom().scaleExtent([1, 12]).translateExtent([[0, 0], [W, H]])
  .filter(ev => (!ev.touches || ev.touches.length > 1) && !ev.button)
  .on("zoom", ev => {
    const kChanged = ev.transform.k !== zt.k;
    zt = ev.transform;
    gZoom.attr("transform", zt);
    if (kChanged) { gDots.selectAll("circle").attr("r", dotR(zt.k)); ring.attr("r", 5 / zt.k); }
    tip.hide(); ring.style("display", "none");
    d3.select("#zoom-reset").property("hidden", zt.k <= 1.01);
    d3.select("#zoom-hint").style("display", zt.k <= 1.01 ? null : "none");
  });
d3.select("#zoom-reset").on("click", () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));
svg.call(zoom).style("touch-action", "pan-y pinch-zoom").on("dblclick.zoom", null);
// double-click zooms in on the spot; double-click when zoomed all the way out does nothing
svg.on("dblclick", ev => {
  const [x, y] = d3.pointer(ev, svg.node());
  svg.transition().duration(350).call(zoom.scaleBy, 2, [x, y]);
});
if (matchMedia("(pointer: coarse)").matches) d3.select("#zoom-hint").text("Pinch to zoom");

const clsName = c => ({ "Populated Place": "town", "Locale": "place" }[c] || c.toLowerCase());
function tipHtml(p, v) {
  const s = D.views[v].states[p.st];
  const where = [p.county && p.st !== "DC" ? `${p.county} County` : "", STATE.get(p.st)].filter(Boolean).join(", ");
  const re = new RegExp(`\\b(${p.word})\\b`, "i");
  const name = p.name.replace(re, `<span class="word" style="color:var(--${p.side})">$1</span>`);
  return `<b>${name}</b><span class="m">A ${clsName(p.cls)} in ${where}</span>
    <div class="bar"><span style="width:${100 - s.pct}%;background:var(--lo)"></span><span style="width:${s.pct}%;background:var(--hi)"></span></div>
    <span class="m">${s.pct}% of ${STATE.get(p.st)}'s ${s.n.toLocaleString()} feeling names are for bad feelings</span>`;
}

let legendEl = null;
function render(v) {
  const V = D.views[v];
  d3.select("#title").text(V.title);
  d3.select("#lede").text(V.lede);
  svg.attr("aria-label", V.title);
  // the rarer side draws on top so it isn't buried
  const topSide = V.hi_n <= V.lo_n ? "hi" : "lo";
  const shown = pts.slice().sort((a, b) => (a.side === topSide) - (b.side === topSide));
  gDots.selectAll("circle").data(shown).join("circle")
    .attr("class", p => `dot ${p.side}`).attr("cx", p => p.x).attr("cy", p => p.y).attr("r", dotR(zt.k));
  MapKit.nearestHover(svg, shown, {
    x: p => p.x, y: p => p.y, radius: 15, transform: () => zt,
    onEnter: (ev, p) => { tip.show(ev, tipHtml(p, v)); ring.style("display", null).attr("cx", p.x).attr("cy", p.y); },
    onLeave: () => { tip.hide(); ring.style("display", "none"); },
  });
  if (legendEl) legendEl.remove();
  // legend in the open Gulf of Mexico, between Texas and Florida
  legendEl = MapKit.legend(svg, {
    x: 560, y: H - 6, anchor: "bottom", width: 220,
    title: "Each dot is one named place",
    keys: [{ cls: "dot lo", r: 4, label: `${V.lo}` }, { cls: "dot hi", r: 4, label: `${V.hi}` }],
  });
  legendEl.selectAll(".lg-key").append("span").attr("class", "lg-count")
    .text((_, i) => (i ? V.hi_n : V.lo_n).toLocaleString());
}
render("emotion");
</script>
</body>
</html>
